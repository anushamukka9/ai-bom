[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-bom"
version = "0.1.0"
description = "AI Bill of Materials for agent apps: one command inventories your models, tools, MCP servers, datasets, and prompts into a manifest with a tamper-evident digest."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anusha Mukka" }]
keywords = ["ai-agents", "sbom", "bill-of-materials", "inventory", "security", "mcp", "supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff>=0.4"]

[project.scripts]
ai-bom = "ai_bom.cli:main"

[project.urls]
Homepage = "https://github.com/anushamukka9/ai-bom"
Issues = "https://github.com/anushamukka9/ai-bom/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_bom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
